name: Run Script
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.js
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          SYNC_URL: https://fabiha-cloud-lab3.netlify.app/api/sync
